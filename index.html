<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <script defer src="./js/script.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='75'>🎃</text></svg>" />  
  <title>Halloween Criollo</title>
</head>
<body>
    <video autoplay loop muted playsinline id="background-video">
      <source src="./resources/video01.mp4" type="video/mp4">
      Tu navegador no soporta la reproducción de video.
    </video>
    <div class="video-atmosphere" aria-hidden="true"></div>
    <div class="logo">
      <div class="box">
        <img src="./resources/logo01.png" alt="Halloween Criollo Logo">
      </div>
    </div>
    <div class="keyhole-overlay"></div>
    <main id="container">
      <header class="game-header">
        <p class="eyebrow">★ RETRO NIGHT ARCADE ★</p>
        <h1>Halloween <span>vs.</span> Criollo</h1>
        <p class="game-instructions">Elige una casilla y consigue tres en línea</p>
      </header>
      <p id="game-status" class="game-status" role="status" aria-live="polite">
        Turno de 🎃 Halloween
      </p>
      <div id="scoreboard">
        <div id="playerHalloween" class="score">🎃Halloween: 0</div>
        <div id="playerCriollo" class="score">🎸Criollo: 0</div>
        <div id="draw" class="score">🤝Empate: 0</div>
      </div>
      <div id="board"></div>
      <div id="notification" class="hidden"></div>
    </main>
</body>
</html>
